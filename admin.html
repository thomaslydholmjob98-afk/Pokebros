<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | The Poke Bros</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="/">THE POKE BROS</a><span class="admin-tag">ORDRESTYRING</span><a class="btn small" href="/">Se hjemmeside</a></header>
<main class="admin-wrap"><section class="admin-login" id="loginBox"><span class="eyebrow">ADMIN</span><h1>Ordrestyring</h1><p>Indtast admin-adgangskoden fra serverens miljøvariabel <code>ADMIN_PASSWORD</code>.</p><form id="loginForm"><input id="adminPassword" type="password" placeholder="Admin-adgangskode" required><button class="btn" type="submit">Åbn dashboard</button></form><p id="loginMsg" class="fineprint"></p></section>
<section id="dashboard" hidden><div class="admin-head"><div><span class="eyebrow">THE POKE BROS</span><h2>Ordredashboard</h2></div><button class="btn ghost" id="refresh">Opdater</button></div><div class="stats"><article><span>Ordrer</span><strong id="statOrders">0</strong></article><article><span>Kort klar til pulje</span><strong id="statPool">0 / 25</strong></article><article><span>Betalt omsætning</span><strong id="statRevenue">0 kr.</strong></article></div><div class="admin-toolbar"><input id="search" placeholder="Søg ordrenr., navn eller e-mail"><select id="filter"><option value="">Alle statusser</option></select></div><div id="orders" class="order-list"></div></section></main>
<script>
let password=sessionStorage.getItem('tpbAdmin')||'', payload=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function load(){const r=await fetch('/api/admin/orders',{headers:{'x-admin-password':password}});const j=await r.json();if(!r.ok)throw new Error(j.error||'Fejl');payload=j;render();}
function render(){loginBox.hidden=true;dashboard.hidden=false;statOrders.textContent=payload.stats.orders;statPool.textContent=payload.stats.poolCards+' / 25';statRevenue.textContent=payload.stats.paidRevenueDkk.toLocaleString('da-DK')+' kr.';filter.innerHTML='<option value="">Alle statusser</option>'+Object.entries(payload.statuses).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('');renderOrders();}
function renderOrders(){const q=search.value.toLowerCase(), f=filter.value;const list=payload.orders.filter(o=>(!f||o.status===f)&&(!q||[o.orderId,o.customer?.name,o.customer?.email].join(' ').toLowerCase().includes(q)));orders.innerHTML=list.length?list.map(o=>`<article class="admin-order"><div class="order-top"><div><b>${esc(o.orderId)}</b><span>${new Date(o.createdAt).toLocaleString('da-DK')}</span></div><span class="pill ${o.paymentStatus==='paid'?'paid':''}">${o.paymentStatus==='paid'?'Betalt':'Betaling: '+esc(o.paymentStatus)}</span></div><div class="order-grid"><div><small>Kunde</small><b>${esc(o.customer?.name)}</b><span>${esc(o.customer?.email)}</span><span>${esc(o.customer?.phone)}</span></div><div><small>Ordre</small><b>${o.qty} kort • ${Number(o.totalDkk).toLocaleString('da-DK')} kr.</b><span>${esc(o.customer?.address)}, ${esc(o.customer?.postal)} ${esc(o.customer?.city)}</span></div></div><div class="admin-controls"><label>Status<select data-status="${esc(o.orderId)}">${Object.entries(payload.statuses).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${esc(v)}</option>`).join('')}</select></label><label>CGC-pulje<input data-batch="${esc(o.orderId)}" value="${esc(o.batch||'')}" placeholder="Fx SEP-2026-01"></label><label>Retur tracking<input data-track="${esc(o.orderId)}" value="${esc(o.trackingNumber||'')}" placeholder="Trackingnr."></label><button class="btn small" data-save="${esc(o.orderId)}">Gem</button></div><details><summary>Historik</summary><div class="timeline-mini">${(o.timeline||[]).slice().reverse().map(t=>`<p><b>${esc(t.label)}</b><span>${new Date(t.at).toLocaleString('da-DK')}${t.note?' • '+esc(t.note):''}</span></p>`).join('')}</div></details></article>`).join(''):'<p class="lead">Ingen ordrer matcher søgningen.</p>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));}
async function save(id){const body={status:document.querySelector(`[data-status="${id}"]`).value,batch:document.querySelector(`[data-batch="${id}"]`).value,trackingNumber:document.querySelector(`[data-track="${id}"]`).value};const r=await fetch('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-password':password},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)return alert(j.error||'Fejl');await load();}
loginForm.onsubmit=async e=>{e.preventDefault();password=adminPassword.value;loginMsg.textContent='';try{await load();sessionStorage.setItem('tpbAdmin',password)}catch(err){loginMsg.textContent=err.message}};refresh.onclick=()=>load().catch(e=>alert(e.message));search.oninput=renderOrders;filter.onchange=renderOrders;if(password)load().catch(()=>sessionStorage.removeItem('tpbAdmin'));
</script></body></html>
