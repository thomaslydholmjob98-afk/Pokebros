<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | The Poke Bros</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .admin-box { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .order-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .order-table th, .order-table td { padding: 10px; border: 1px solid #eee; text-align: left; font-size: 14px; }
        .order-table th { background: #f8f9fa; }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="index.html">THE POKE BROS ADMIN</a>
    </header>

    <main class="admin-container">
        <!-- Login sektion -->
        <div id="loginBox" class="admin-box">
            <h2>Admin Login</h2>
            <div class="form-group">
                <label>Admin Adgangskode</label>
                <input type="password" id="adminPass" placeholder="Indtast adgangskode...">
            </div>
            <button class="btn" onclick="loadAdminData()">Log ind</button>
            <p id="loginMsg" style="color:red; margin-top:10px;"></p>
        </div>

        <!-- Admin Indhold -->
        <div id="adminContent" style="display:none;">
            <!-- Tilføj Produkt Formular -->
            <div class="admin-box">
                <h2>Opret nyt produkt til Shoppen</h2>
                <form id="addProductForm">
                    <div class="form-group">
                        <label>Titel på kort / vare</label>
                        <input type="text" name="title" placeholder="fx Charizard Base Set Shadowless CGC 9" required>
                    </div>
                    <div style="display:flex; gap:15px;">
                        <div class="form-group" style="flex:1;">
                            <label>Kategori</label>
                            <select name="category" required>
                                <option value="slab">CGC Slab</option>
                                <option value="raw">Enkeltkort (Raw)</option>
                                <option value="sealed">Sealed / Tilbehør</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label>Pris (DKK)</label>
                            <input type="number" name="priceDkk" placeholder="fx 1250" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Billede URL (Imgur, Google Drive eller direkte link)</label>
                        <input type="url" name="imageUrl" placeholder="https://i.imgur.com/...">
                    </div>
                    <button type="submit" class="btn">Tilføj produkt til shop</button>
                    <p id="productMsg" style="margin-top:10px; font-weight:bold;"></p>
                </form>
            </div>

            <!-- Ordreoversigt -->
            <div class="admin-box">
                <h2>Grading Ordreoversigt</h2>
                <div id="statsBox" style="margin-bottom:15px; font-weight:bold;"></div>
                <div style="overflow-x:auto;">
                    <table class="order-table">
                        <thead>
                            <tr>
                                <th>Ordre ID</th>
                                <th>Kunde</th>
                                <th>Kort</th>
                                <th>Tier</th>
                                <th>Status</th>
                                <th>Handling</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
    let currentPass = '';

    async function loadAdminData() {
        const pass = document.getElementById('adminPass').value;
        const msg = document.getElementById('loginMsg');
        msg.textContent = 'Verificerer...';

        try {
            const res = await fetch('/api/admin/orders', {
                headers: { 'x-admin-password': pass }
            });
            
            if (!res.ok) throw new Error('Forkert adgangskode.');

            const data = await res.json();
            currentPass = pass;
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            
            renderOrders(data);
        } catch (err) {
            msg.textContent = err.message;
        }
    }

    function renderOrders(data) {
        document.getElementById('statsBox').textContent = `Total ordrer: ${data.stats.orders} | Puljekort ankommet: ${data.stats.poolCards} | Medlemmer: ${data.stats.members}`;
        
        const tbody = document.getElementById('ordersTableBody');
        tbody.innerHTML = data.orders.map(o => `
            <tr>
                <td><b>${o.orderId}</b></td>
                <td>${o.customer_name}<br><small>${o.customer_email}</small></td>
                <td>${o.qty} stk.</td>
                <td>${o.tier}</td>
                <td><span style="background:#e0e0e0; padding:3px 6px; border-radius:4px; font-size:12px;">${o.statusLabel}</span></td>
                <td>
                    <select onchange="updateStatus('${o.orderId}', this.value)">
                        <option value="">Skift status...</option>
                        ${Object.entries(data.statuses).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}
                    </select>
                </td>
            </tr>
        `).join('');
    }

    async function updateStatus(orderId, newStatus) {
        if (!newStatus) return;
        try {
            await fetch(`/api/admin/orders/${orderId}`, {
                method: 'PATCH',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-admin-password': currentPass 
                },
                body: JSON.stringify({ status: newStatus })
            });
            alert('Status opdateret!');
            loadAdminData();
        } catch (err) {
            alert('Fejl ved opdatering af status.');
        }
    }

    // Opret produkt submit handler
    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('productMsg');
        msg.textContent = 'Opretter produkt...';

        const data = Object.fromEntries(new FormData(e.target));
        data.categoryLabel = e.target.category.options[e.target.category.selectedIndex].text;

        try {
            const res = await fetch('/api/admin/products', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-password': currentPass
                },
                body: JSON.stringify(data)
            });

            const result = await res.json();
            if (res.ok) {
                msg.style.color = 'green';
                msg.textContent = 'Varen er nu oprettet i shoppen!';
                e.target.reset();
            } else {
                throw new Error(result.error || 'Fejl ved oprettelse');
            }
        } catch (err) {
            msg.style.color = 'red';
            msg.textContent = err.message;
        }
    });
    </script>
</body>
</html>
