<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log ind | The Poke Bros</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="/">THE POKE BROS</a><nav><a href="/">Forside</a><a href="track.html">Spor ordre</a></nav></header><main class="account-shell"><section class="auth-card"><span class="eyebrow">MIN KONTO</span><h1>Log ind eller opret konto</h1><p class="lead">Din konto samler medlemskab, ordrer og tracking ét sted.</p><div class="auth-tabs"><button class="active" data-tab="login">Log ind</button><button data-tab="register">Opret konto</button></div><form id="loginForm" class="auth-form"><label>E-mail<input type="email" name="email" required autocomplete="email"></label><label>Adgangskode<input type="password" name="password" required autocomplete="current-password"></label><button class="btn" type="submit">Log ind</button><p class="fineprint" id="loginMsg"></p></form><form id="registerForm" class="auth-form" hidden><label>Navn<input name="name" required autocomplete="name"></label><label>E-mail<input type="email" name="email" required autocomplete="email"></label><label>Telefon<input type="tel" name="phone" autocomplete="tel"></label><label>Adgangskode<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><button class="btn" type="submit">Opret konto</button><p class="fineprint" id="registerMsg">Mindst 8 tegn.</p></form></section></main><script>
(async()=>{const m=await fetch('/api/auth/me').then(r=>r.json()).catch(()=>null);if(m?.loggedIn)location.href='/account.html'})();
document.querySelectorAll('.auth-tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.auth-tabs button').forEach(x=>x.classList.toggle('active',x===b));loginForm.hidden=b.dataset.tab!=='login';registerForm.hidden=b.dataset.tab!=='register'});
async function submit(form,url,msg){const data=Object.fromEntries(new FormData(form));const out=document.getElementById(msg);out.textContent='Arbejder…';try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw new Error(j.error||'Noget gik galt');location.href='/account.html'}catch(e){out.textContent=e.message}}
loginForm.onsubmit=e=>{e.preventDefault();submit(loginForm,'/api/auth/login','loginMsg')};registerForm.onsubmit=e=>{e.preventDefault();submit(registerForm,'/api/auth/register','registerMsg')};
</script><div style="text-align:center;padding:24px;font-size:13px;opacity:.75"><a href="/handelsbetingelser.html">Handelsbetingelser</a> · <a href="/privatliv.html">Privatlivspolitik</a></div></body></html>
