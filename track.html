<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spor din grading | The Poke Bros</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="/">THE POKE BROS</a><a class="btn small" href="/#order">Bestil grading</a></header><main class="track-wrap"><section><span class="eyebrow">ORDRESTATUS</span><h1>Spor dine kort</h1><p class="lead">Indtast dit ordrenummer og den e-mail, du brugte ved bestilling.</p><form id="trackForm" class="track-form"><label>Ordrenummer<input id="orderId" placeholder="TPB-20260910-ABC123" required></label><label>E-mail<input id="email" type="email" required></label><button class="btn" type="submit">Vis status</button><p id="msg" class="fineprint"></p></form><div id="result"></div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));trackForm.onsubmit=async e=>{e.preventDefault();msg.textContent='';result.innerHTML='';const r=await fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:orderId.value,email:email.value})});const j=await r.json();if(!r.ok){msg.textContent=j.error||'Ordren kunne ikke findes.';return}result.innerHTML=`<article class="track-card"><div class="track-title"><div><small>Ordre</small><h2>${esc(j.orderId)}</h2></div><span class="status-big">${esc(j.statusLabel)}</span></div><div class="track-meta"><span><b>${j.qty}</b> kort</span><span><b>${Number(j.totalDkk).toLocaleString('da-DK')} kr.</b> total</span>${j.batch?`<span><b>${esc(j.batch)}</b> CGC-pulje</span>`:''}${j.trackingNumber?`<span><b>${esc(j.trackingNumber)}</b> tracking</span>`:''}</div><div class="timeline">${(j.timeline||[]).map((t,i)=>`<div class="timeline-row"><i></i><div><b>${esc(t.label)}</b><span>${new Date(t.at).toLocaleString('da-DK')}${t.note?' • '+esc(t.note):''}</span></div></div>`).join('')}</div></article>`};
</script><div style="text-align:center;padding:24px;font-size:13px;opacity:.75"><a href="/handelsbetingelser.html">Handelsbetingelser</a> · <a href="/privatliv.html">Privatlivspolitik</a></div></body></html>
