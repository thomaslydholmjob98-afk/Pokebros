<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Min Konto | The Poke Bros</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .account-container { max-width: 900px; margin: 40px auto; padding: 0 20px; color: #fff; }
        .account-card { background: #111318; border: 1px solid #222; border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .account-card h2 { color: #e63946; margin-top: 0; }
        .order-row { background: #1a1e29; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .order-info b { color: #fff; font-size: 16px; }
        .order-info p { color: #aaa; margin: 5px 0 0 0; font-size: 14px; }
        .badge { background: #222633; color: #ff4d5a; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .btn-slip-small { display: inline-block; background: #e63946; color: #fff; padding: 8px 14px; font-size: 13px; font-weight: bold; text-decoration: none; border-radius: 4px; transition: background 0.2s; }
        .btn-slip-small:hover { background: #d90429; }
        .logout-btn { background: transparent; border: 1px solid #e63946; color: #e63946; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .logout-btn:hover { background: #e63946; color: #fff; }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="index.html">THE POKE BROS</a>
        <nav>
            <a href="index.html">Forsiden</a>
            <a href="shop.html">Shop</a>
            <a href="track.html">Spor ordre</a>
        </nav>
    </header>

    <main class="account-container">
        <!-- Brugerprofil Sektion -->
        <div class="account-card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div>
                    <h2 id="userName">Indlæserprofil...</h2>
                    <p id="userEmail" style="color: #aaa; margin: 0;"></p>
                </div>
                <button class="logout-btn" onclick="logout()">Log ud</button>
            </div>
            <div id="membershipStatus" style="margin-top: 20px; padding: 15px; background: #1a1e29; border-radius: 8px; border: 1px solid #333;">
                <b>Medlemskab:</b> <span id="memberDesc">Indlæser medlemsstatus...</span>
            </div>
        </div>

        <!-- Ordrer & Pakkesedler Sektion -->
        <div class="account-card">
            <h2>Dine Ordrer & Pakkesedler</h2>
            <p style="color: #aaa; font-size: 14px;">Her kan du se dine tidligere ordrer og hente din pakkeseddel, som <strong>skal udskrives og lægges med i kassen</strong> sammen med dine kort.</p>
            <div id="ordersList" style="margin-top: 20px;">
                <p style="color: #666;">Indlæser ordrer...</p>
            </div>
        </div>
    </main>

    <script>
        async function loadAccountData() {
            try {
                const res = await fetch('/api/account');
                if (!res.ok) {
                    // Hvis ikke logget ind, send til login-siden
                    window.location.href = 'login.html';
                    return;
                }
                const data = await res.json();
                
                // Vis profil-info
                document.getElementById('userName').textContent = data.user.name;
                document.getElementById('userEmail').textContent = data.user.email;
                
                const memberDesc = data.user.membership.active 
                    ? `Aktiv (${data.user.membership.plan === 'yearly' ? 'Årskort' : 'Månedskort'}) - Du har fordelagtige medlemspriser!`
                    : 'Ingen aktivt medlemskab. (Tilmeld dig på forsiden for at få rabat på Bulk-grading).';
                document.getElementById('memberDesc').textContent = memberDesc;

                // Vis ordrer
                const list = document.getElementById('ordersList');
                if (!data.orders || data.orders.length === 0) {
                    list.innerHTML = '<p style="color: #888;">Du har endnu ikke oprettet nogen ordrer.</p>';
                    return;
                }

                list.innerHTML = data.orders.map(o => `
                    <div class="order-row">
                        <div class="order-info">
                            <b>Ordre: ${o.orderId}</b>
                            <p>Dato: ${new Date(o.createdAt).toLocaleDateString('da-DK')} • Antal: ${o.qty} stk. (${o.tier.toUpperCase()})</p>
                            <p><span class="badge">${o.statusLabel}</span> • Total: ${o.totalDkk} kr.</p>
                        </div>
                        <div>
                            <a href="packingslip.html?order=${o.orderId}" class="btn-slip-small" target="_blank">📄 Udskriv Pakkeseddel</a>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                window.location.href = 'login.html';
            }
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = 'index.html';
        }

        loadAccountData();
    </script>
</body>
</html>
