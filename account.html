<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Min konto | The Poke Bros</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="/">THE POKE BROS</a><nav><a href="/#order">Bestil grading</a><a href="track.html">Spor ordre</a></nav><button class="btn small ghost" id="logout">Log ud</button></header><main class="account-shell"><section id="loading" class="auth-card"><span class="eyebrow">MIN KONTO</span><h1>Henter din konto…</h1></section><section id="account" hidden><div class="account-head"><div><span class="eyebrow">MIN POKE BRO-KONTO</span><h1 id="hello">Hej</h1><p class="lead" id="email"></p></div><a class="btn" href="/#order">Bestil grading</a></div><div class="member-status" id="memberBox"></div><div class="account-grid"><article><span>Aktive ordrer</span><strong id="activeCount">0</strong></article><article><span>Samlede ordrer</span><strong id="orderCount">0</strong></article><article><span>Bulk-pris</span><strong id="bulkPrice">279 kr.</strong></article></div><section class="account-orders"><div class="section-title"><div><span class="eyebrow">DINE KORT</span><h2>Ordrehistorik og tracking</h2></div></div><div id="orders" class="order-list"></div></section></section></main><script>
const fmt=d=>new Date(d).toLocaleDateString('da-DK',{day:'2-digit',month:'short',year:'numeric'});
function orderCard(o){const steps=(o.timeline||[]).slice().reverse().slice(0,3).map(t=>`<div class="mini-step"><b>${t.label}</b><span>${fmt(t.at)}</span>${t.note?`<small>${t.note}</small>`:''}</div>`).join('');return `<article class="account-order"><div class="order-top"><div><small>${fmt(o.createdAt)}</small><h3>${o.orderId}</h3><span>${o.qty} kort • ${(o.tier||'bulk').toUpperCase()}</span></div><div class="status-big">${o.statusLabel}</div></div><div class="track-meta"><span>I alt <b>${Number(o.totalDkk).toLocaleString('da-DK')} kr.</b></span>${o.batch?`<span>CGC-pulje <b>${o.batch}</b></span>`:''}${o.trackingNumber?`<span>Tracking <b>${o.trackingNumber}</b></span>`:''}</div><div class="timeline-mini">${steps||'<p>Ingen statusopdateringer endnu.</p>'}</div></article>`}
async function load(){try{const p=new URLSearchParams(location.search);if(p.get('membership')==='success'&&p.get('session_id'))await fetch('/api/confirm-membership',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:p.get('session_id')})});const r=await fetch('/api/account'),j=await r.json();if(r.status===401){location.href='/login.html';return}if(!r.ok)throw new Error(j.error||'Kunne ikke hente konto');loading.hidden=true;account.hidden=false;hello.textContent=`Hej ${j.user.name.split(' ')[0]}`;email.textContent=j.user.email;const active=j.orders.filter(o=>!['completed','shipped'].includes(o.status)).length;activeCount.textContent=active;orderCount.textContent=j.orders.length;bulkPrice.textContent=j.pricing.bulk.toLocaleString('da-DK')+' kr.';memberBox.innerHTML=j.user.membership?.active?`<div><span class="member-badge">POKE BRO MEMBER</span><h2>Dit medlemskab er aktivt</h2><p>Du får Bulk til <b>249 kr. pr. kort</b> og 5 % medlemsrabat på øvrige faste tiers.</p></div><a class="btn ghost" href="/#order">Brug medlemspris</a>`:`<div><span class="eyebrow">MEDLEMSKAB</span><h2>Du er ikke Poke Bro-medlem endnu</h2><p>Få Bulk til 249 kr. pr. kort og medlemsfordele.</p></div><a class="btn" href="/#membership">Bliv en Poke Bro</a>`;orders.innerHTML=j.orders.length?j.orders.map(orderCard).join(''):'<div class="empty-state"><h3>Ingen ordrer endnu</h3><p>Når du bestiller grading, dukker dine kort og status op her.</p><a class="btn" href="/#order">Bestil første grading</a></div>';}catch(e){loading.innerHTML=`<h1>Kunne ikke hente kontoen</h1><p>${e.message}</p>`}}
logout.onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/'};load();
</script><div style="text-align:center;padding:24px;font-size:13px;opacity:.75"><a href="/handelsbetingelser.html">Handelsbetingelser</a> · <a href="/privatliv.html">Privatlivspolitik</a></div></body></html>
